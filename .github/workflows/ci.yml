name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="2.0.0"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish src/LegoToyPad.App -c Release -r ${{ matrix.rid }} -o publish
          -p:Version=${{ steps.version.outputs.value }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath LegoToyPad-${{ matrix.rid }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp packaging/linux/99-lego-toypad.rules publish/
          tar -czf LegoToyPad-${{ matrix.rid }}.tar.gz -C publish .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/make-app.sh publish dist ${{ steps.version.outputs.value }}
          ditto -c -k --keepParent dist/LegoToyPad.app LegoToyPad-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LegoToyPad-${{ matrix.rid }}
          path: LegoToyPad-${{ matrix.rid }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
